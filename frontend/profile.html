<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - AutoLambada</title>
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <header class="header">
        <nav class="header-nav">
            <div class="header-logo">
                <img src="images/logo.ico" alt="AutoLambada" width="40" height="40" class="header-logo-image">
                <p class="header-title">AutoLambada</p>
            </div>
            <div class="header-nav-links" id="navLinks">
                <!-- Навигация будет динамически меняться через JS -->
            </div>
        </nav>
    </header>
    <script src="js/navigation.js"></script>

    <main class="main">
        <div class="profile-page">
            <div class="profile-container">
                <!-- Левая колонка - информация профиля -->
                <div class="profile-left-block">
                    <p class="profile-title">Профиль</p>
                    <div class="profile-icon">
                        <img src="images/profile-icon.svg" alt="Профиль пользователя" class="profile-image" width="300" height="300">
                    </div>
                    <p class="profile-name">Загрузка...</p>
                    <p class="profile-status">Загрузка...</p>
                    
                    <div class="profile-contacts">
                        <p class="profile-phone">Телефон: Загрузка...</p>
                        <p class="profile-email">Email: Загрузка...</p>
                    </div>

                    <button onclick="logout()" class="profile-logout-btn">Выйти</button>
                </div>

                <!-- Правая колонка - избранное -->
                <div class="profile-right-block">
                    <h1 class="profile-favourites-title">Избранные автомобили</h1>
                    <div class="profile-cars-list">
                        <!-- Автомобили будут загружены динамически -->
                        <div class="profile-loading">
                            Загрузка избранных автомобилей...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contacts">
            <p class="footer-contacts-title">Контакты</p>
            <p class="footer-contacts-phone">Телефон: +7 (999) 123-45-67</p>
            <p class="footer-contacts-email">Email: info@autolambada.ru</p>
            <p class="footer-contacts-address">Адрес: Самара, ул. Автомобильная, 1</p>
        </div>
        <div class="footer-about">
            <a href="about.html" class="footer-about-link">О нас</a>
        </div>
    </footer>

    <script src="js/profile.js"></script>
</body>
</html>
