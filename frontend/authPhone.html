<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход по телефону - AutoLambada</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <header class="header">
        <nav class="header-nav">
            <div class="header-logo">
                <img src="images/logo.ico" alt="AutoLambada" width="40" height="40" class="header-logo-image">
                <p class="header-title">AutoLambada</p>
            </div>
            <div class="header-nav-links" id="navLinks">
                <!-- Навигация будет динамически меняться через JS -->
            </div>
        </nav>
    </header>
    <script src="js/navigation.js"></script>

    <main class="main">
        <div class="auth-container">
            <div class="auth-card">
                <h1 class="auth-title">Вход по номеру телефона</h1>

                <div class="auth-method-switcher">
                    <span class="auth-method-text">Или войдите </span>
                    <a href="authEmail.html" class="auth-method-link">через почту</a>
                </div>

                <div class="auth-error-messages" style="display: none;">
                    <div class="auth-error-message">
                        Пример сообщения об ошибке
                    </div>
                </div>

                <form class="auth-form">
                    <div class="auth-form-group">
                        <label class="auth-form-label">Номер телефона</label>
                        <input
                            type="tel"
                            placeholder="+7 (___) ___-__-__"
                            class="auth-form-input"
                            required
                        />
                    </div>

                    <div class="auth-form-group">
                        <label class="auth-form-label">Пароль</label>
                        <input
                            type="password"
                            placeholder="Введите пароль"
                            class="auth-form-input"
                            required
                        />
                    </div>

                    <button type="submit" class="auth-submit-btn">
                        Войти в личный кабинет
                    </button>
                </form>

                <div class="auth-footer">
                    <span class="auth-footer-text">Ещё нет аккаунта?</span>
                    <a href="register.html" class="auth-register-link">
                        Зарегистрироваться
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contacts">
            <p class="footer-contacts-title">Контакты</p>
            <p class="footer-contacts-phone">Телефон: +7 (999) 123-45-67</p>
            <p class="footer-contacts-email">Email: info@autolambada.ru</p>
            <p class="footer-contacts-address">Адрес: Самара, ул. Автомобильная, 1</p>
        </div>
        <div class="footer-about">
            <a href="about.html" class="footer-about-link">О нас</a>
        </div>
    </footer>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
