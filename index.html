<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLambada - Главная</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="header">
        <nav class="header-nav">
            <div class="header-logo">
                <img src="images/logo.ico" alt="AutoLambada" width="40" height="40" class="header-logo-image">
                <p class="header-title">AutoLambada</p>
            </div>
            <div class="header-nav-links" id="navLinks">
                <!-- Навигация будет динамически меняться через JS -->
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="index-filters-section">
            <p class="index-filters-title">Автомобильные фильтры</p>
            
            <form class="index-filter-form" id="filterForm">
                <div class="index-filter-group">
                    <label class="index-filter-label">Коробка передач</label>
                    <select class="index-filter-select" id="filterTransmission">
                        <option value="">Любая</option>
                        <!-- Опции будут загружаться из БД (transmission_types) -->
                    </select>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Цвет</label>
                    <select class="index-filter-select" id="filterColor">
                        <option value="">Любой</option>
                        <!-- Цвета будут загружаться из БД (уникальные значения из cars.color) -->
                    </select>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Тип кузова</label>
                    <select class="index-filter-select" id="filterBodyType">
                        <option value="">Любой</option>
                        <!-- Опции будут загружаться из БД (body_types) -->
                    </select>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Тип топлива</label>
                    <select class="index-filter-select" id="filterFuelType">
                        <option value="">Любой</option>
                        <!-- Опции будут загружаться из БД (fuel_types) -->
                    </select>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Цена (₽)</label>
                    <div class="range-slider-container">
                        <input type="range" id="priceMin" min="0" max="10000000" step="100000" value="0" class="range-slider range-min">
                        <input type="range" id="priceMax" min="0" max="10000000" step="100000" value="10000000" class="range-slider range-max">
                    </div>
                    <div class="range-slider-values">
                        <span class="range-value" id="price-min">0 ₽</span>
                        <span class="range-separator">-</span>
                        <span class="range-value" id="price-max">10 000 000 ₽</span>
                    </div>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Год выпуска</label>
                    <div class="range-slider-container">
                        <input type="range" id="yearMin" min="1990" max="2025" step="1" value="1990" class="range-slider range-min">
                        <input type="range" id="yearMax" min="1990" max="2025" step="1" value="2025" class="range-slider range-max">
                    </div>
                    <div class="range-slider-values">
                        <span class="range-value" id="year-min">1990</span>
                        <span class="range-separator">-</span>
                        <span class="range-value" id="year-max">2025</span>
                    </div>
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Максимальный пробег (км)</label>
                    <input type="number" id="filterMileage" placeholder="До" class="index-filter-number" min="0" max="500000" step="1000">
                </div>

                <div class="index-filter-group">
                    <label class="index-filter-label">Поиск по марке и модели</label>
                    <div class="search-wrapper">
                        <input type="text" 
                            id="searchInput" 
                            class="index-search-input" 
                            placeholder="Введите марку или модель (например, Toyota, Camry...)"
                            autocomplete="off">
                        <div id="searchSuggestions" class="search-suggestions"></div>
                    </div>
                </div>

                <div class="filter-actions">
                    <button type="reset" class="filter-reset-btn">Сбросить</button>
                    <button type="submit" class="filter-apply-btn">Применить</button>
                </div>
            </form>
        </section>

        <section class="index-cars-section">
            <h1 class="index-cars-title">Автомобили в наличии</h1>
            <div class="index-cars-grid" id="carsGrid">
                <!-- Автомобили будут загружаться из БД через JS -->
            </div>
            
            <div class="index-cars-load-more-container" id="loadMoreContainer">
                <button id="load-more-btn" class="index-cars-load-more-btn">
                    Загрузить ещё
                </button>
            </div>
            
            <div class="index-cars-not-found" id="noCarsMessage" style="display: none;">
                <p>Автомобили не найдены</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-contacts">
            <p class="footer-contacts-title">Контакты</p>
            <p class="footer-contacts-phone">Телефон: +7 (999) 123-45-67</p>
            <p class="footer-contacts-email">Email: info@autolambada.ru</p>
            <p class="footer-contacts-address">Адрес: Самара, ул. Автомобильная, 1</p>
        </div>
        <div class="footer-about">
            <a href="about.html" class="footer-about-link">О нас</a>
        </div>
    </footer>
    
    <!-- Шаблон для карточки автомобиля (будет использоваться JS) -->
    <template id="carCardTemplate">
        <a href="carDetail.html" class="index-car-card-link">
            <div class="index-car-card">
                <div class="index-car-card-photo-wrapper">
                    <img src="" alt="" width="300" height="200" class="index-car-card-image">
                </div>

                <div class="index-car-card-features" id="carFeatures">
                    <!-- Особенности будут добавляться динамически -->
                </div>

                <div class="index-car-card-header">
                    <p class="index-car-card-price"></p>
                    <button class="index-car-card-favorite-btn" data-car-id="">🤍</button>
                </div>
                
                <h2 class="index-car-card-title"></h2>

                <div class="index-car-card-details">
                    <span class="index-car-card-mileage"></span>
                    <span class="index-car-card-engine"></span>
                </div>

                <div class="index-car-card-specs">
                    <span class="index-car-card-transmission"></span>
                    <span class="index-car-card-body-type"></span>
                    <span class="index-car-card-color"></span>
                </div>
            </div>
        </a>
    </template>

    <script src="js/api.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/hearts.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
